name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the bundle and make sure it is committed
        run: |
          python3 tools/build.py
          # git status (not git diff) so a generated page or tool bundle that was never added also fails the check.
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Run python3 tools/build.py and commit the result, including any new files"
            exit 1
          fi
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve the site and run the smoke test
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          sleep 1
          npm run check
      - name: Run the tool profile on every page in tools/pages.txt
        run: |
          python3 -m http.server 8081 --bind 127.0.0.1 &
          sleep 1
          status=0
          while IFS= read -r page || [ -n "$page" ]; do
            page="${page%%#*}"
            page="$(echo "$page" | tr -d '[:space:]')"
            [ -z "$page" ] && continue
            echo "Tool profile: $page"
            node tools/check.js http://127.0.0.1:8081/ --profile tool --path "$page" || status=1
          done < tools/pages.txt
          exit $status
