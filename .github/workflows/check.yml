name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the bundle and make sure it is committed
        run: |
          python3 tools/build.py
          git diff --exit-code -- assets/app.js assets/app.css index.html || (echo "Run python3 tools/build.py and commit the result" && exit 1)
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve the site and run the smoke test
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          sleep 1
          npm run check
